  - id: agent_11
    type: agent
    position:
      x: 260
      'y': -170
    data:
      agent: implementer
      prompt: ''
      model: qwen3.6-27b
      timeout: 300
      retries: 0
  - id: agent_14
    type: agent
    position:
      x: 140
      'y': 170
    data:
      agent: reviewer
      prompt: 'Review the implementer''s work. Return a JSON object with these fields: passed (boolean - true if the review passes, false otherwise), reason (string - detailed feedback on what needs improvement if failed, or summary of what passed), review_attempts (number - set to 1 if review_reason already exists in the workflow state indicating this is a retry, otherwise set to 0).'
      model: qwen3.6-27b
      timeout: 300
      retries: 0
      stateWrites:
        - source: passed
          target: state.review_passed
        - source: reason
          target: state.review_reason
        - source: review_attempts
          target: state.review_attempts
  - id: condition_19
    type: condition
    position:
      x: 280
      'y': 20
    data:
      expression: state.review_passed === true || state.review_attempts >= 1
      description: Pass if review passed or already looped back once
