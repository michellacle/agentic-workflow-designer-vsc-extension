name: implement feature
nodes:
  - id: start_1
    type: start
    position:
      x: 50
      'y': 0
    data:
      label: Start
  - id: agent_11
    type: agent
    position:
      x: 270
      'y': -10
    data:
      agent: implementer
      prompt: ''
      model: qwen3.6-27b
      timeout: 300
      retries: 0
  - id: agent_14
    type: agent
    position:
      x: 280
      'y': 130
    data:
      agent: reviewer
      prompt: 'Review the implementer''s work. Return a JSON object with these fields: passed (boolean - true if the review passes, false otherwise), reason (string - detailed feedback on what needs improvement if failed, or summary of what passed), review_attempts (number - set to 1 if review_reason already exists in the workflow state indicating this is a retry, otherwise set to 0).'
      model: qwen3.6-27b
      timeout: 300
      retries: 0
      stateWrites:
        - source: passed
          target: state.review_passed
        - source: reason
          target: state.review_reason
        - source: review_attempts
          target: state.review_attempts
  - id: condition_19
    type: condition
    position:
      x: 280
      'y': 210
    data:
      expression: state.review_passed === true || state.review_attempts >= 1
      description: Pass if review passed or already looped back once
  - id: agent_15
    type: agent
    position:
      x: 260
      'y': 310
    data:
      agent: tester
      prompt: ''
      model: qwen3.6-27b
      timeout: 300
      retries: 0
  - id: agent_16
    type: agent
    position:
      x: 360
      'y': 540
    data:
      agent: builder
      prompt: ''
      model: qwen3.6-27b
      timeout: 120
      retries: 0
  - id: end_17
    type: end
    position:
      x: 620
      'y': 540
    data:
      label: End
      summary: true
  - id: agent_18
    type: agent
    position:
      x: 280
      'y': 430
    data:
      agent: qa
      prompt: ''
      model: qwen3.6-27b
      timeout: 120
      retries: 0
edges:
  - source: agent_11
    target: agent_14
  - source: agent_14
    target: condition_19
  - source: condition_19
    target: agent_11
    label: 'False'
  - source: condition_19
    target: agent_15
    label: 'True'
  - source: agent_16
    target: end_17
  - source: start_1
    target: agent_11
  - source: agent_15
    target: agent_18
  - source: agent_18
    target: agent_16
description: Implement workflow with review loop - reviewer can send back to implementer once before continuing
