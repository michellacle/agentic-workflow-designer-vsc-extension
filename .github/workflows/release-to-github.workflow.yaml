name: release-to-github
nodes:
  - id: start
    type: start
    position:
      x: 300
      'y': 0
    data:
      label: Start
  - id: compile_ts
    type: agent
    position:
      x: 300
      'y': 120
    data:
      agent: builder
      prompt: Compile the TypeScript source code by running `npm run compile`. Verify the compilation succeeds with no errors. Report any compilation errors found.
      model: qwen3.6-27b
      timeout: 120
      retries: 1
  - id: build_webview
    type: agent
    position:
      x: 300
      'y': 260
    data:
      agent: builder
      prompt: Build the webview assets by running `npm run build-webview`. Verify the build succeeds and that webview/dist/ contains the expected designer.js and designer.css files.
      model: qwen3.6-27b
      timeout: 120
      retries: 1
  - id: package_vsix
    type: agent
    position:
      x: 300
      'y': 400
    data:
      agent: builder
      prompt: Package the extension into a .vsix file by running `npx vsce package`. Verify the .vsix file was created successfully and report its file size.
      model: qwen3.6-27b
      timeout: 120
      retries: 1
  - id: commit_assets
    type: agent
    position:
      x: 300
      'y': 540
    data:
      agent: builder
      prompt: 'Stage any new or changed documentation images in docs/ using `git add docs/*.png`, then commit with message "docs: add release assets" and push to remote. Skip this step if there are no new images to commit.'
      model: qwen3.6-27b
      timeout: 60
      retries: 0
  - id: create_release_notes
    type: agent
    position:
      x: 300
      'y': 680
    data:
      agent: builder
      prompt: Create a release notes Markdown file at release-notes.md. Include a summary of features, technical details, and embed any screenshots from docs/ using raw GitHub URLs. Use the current version from package.json.
      model: qwen3.6-27b
      timeout: 60
      retries: 0
  - id: create_github_release
    type: agent
    position:
      x: 300
      'y': 820
    data:
      agent: builder
      prompt: Get the version from package.json, then create a GitHub release using `gh release create v<VERSION> <VERSION>.vsix --notes-file release-notes.md`. After creating the release, clean up the temporary release-notes.md file.
      model: qwen3.6-27b
      timeout: 60
      retries: 1
  - id: end
    type: end
    position:
      x: 320
      'y': 980
    data:
      label: Release Published
      summary: true
  - id: note_checklist
    type: note
    position:
      x: 560
      'y': 120
    data:
      text: |
        Release Checklist:
        1. Compile TypeScript
        2. Build webview
        3. Package .vsix
        4. Commit screenshots
        5. Draft release notes
        6. Create GitHub release
      description: Release steps
edges:
  - source: start
    target: compile_ts
    sourceSide: bottom
    targetSide: top
    type: agentic
  - source: compile_ts
    target: build_webview
    sourceSide: bottom
    targetSide: top
    type: agentic
  - source: build_webview
    target: package_vsix
    sourceSide: bottom
    targetSide: top
    type: agentic
  - source: package_vsix
    target: commit_assets
    sourceSide: bottom
    targetSide: top
    type: agentic
  - source: commit_assets
    target: create_release_notes
    sourceSide: bottom
    targetSide: top
    type: agentic
  - source: create_release_notes
    target: create_github_release
    sourceSide: bottom
    targetSide: top
    type: agentic
  - source: create_github_release
    target: end
    sourceSide: bottom
    targetSide: top
    type: agentic
description: Build the extension, commit assets, and publish a GitHub release with screenshots and release notes
