name: test-loop
nodes:
  - id: start_1
    type: start
    position:
      x: 300
      'y': 20
    data:
      label: Start
  - id: agent_2
    type: agent
    position:
      x: 300
      'y': 120
    data:
      agent: implementer
      prompt: Implement the task
      timeout: 120
      retries: 0
  - id: agent_3
    type: agent
    position:
      x: 300
      'y': 240
    data:
      agent: tester
      prompt: Run tests
      timeout: 60
      retries: 0
      stateWrites:
        - source: tests_passed
          target: tests_passed
  - id: condition_4
    type: condition
    position:
      x: 300
      'y': 360
    data:
      expression: state.tests_passed === true
  - id: end_5
    type: end
    position:
      x: 100
      'y': 480
    data:
      label: Passed
  - id: delay_6
    type: delay
    position:
      x: 500
      'y': 480
    data:
      duration: 2
  - id: end_7
    type: end
    position:
      x: 500
      'y': 580
    data:
      label: Failed
  - id: condition_8
    type: condition
    position:
      x: 30
      'y': 130
    data:
      expression: state.result === true
  - id: human_approval_9
    type: human_approval
    position:
      x: 70
      'y': 250
    data:
      message: Approve this step?
  - id: delay_10
    type: delay
    position:
      x: 70
      'y': 340
    data:
      duration: 5
edges:
  - source: start_1
    target: agent_2
  - source: agent_2
    target: agent_3
  - source: agent_3
    target: condition_4
  - source: condition_4
    target: end_5
    label: true
  - source: condition_4
    target: delay_6
  - source: delay_6
    target: end_7
description: Workflow with a retry loop - Implement → Test → Pass? → loop back or complete
