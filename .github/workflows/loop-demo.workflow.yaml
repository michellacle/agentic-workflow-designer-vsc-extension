name: loop-demo
description: Demonstrates the Loop node - runs a counter agent 3 times using count mode
nodes:
  - id: start_1
    type: start
    position:
      x: 100
      y: 200
    data:
      label: Start
  - id: loop_2
    type: loop
    position:
      x: 300
      y: 200
    data:
      mode: count
      maxIterations: 3
      description: Run the counter agent 3 times
  - id: agent_3
    type: agent
    position:
      x: 520
      y: 140
    data:
      agent: counter
      prompt: Increment the counter. Check state.counter for current value (default 0), add 1, and output JSON with the new counter value.
      model: qwen3.6-27b
      timeout: 60
      retries: 0
      stateWrites:
        - source: json.counter
          target: counter
  - id: delay_4
    type: delay
    position:
      x: 520
      y: 260
    data:
      duration: 1
      description: Brief pause between iterations
  - id: end_5
    type: end
    position:
      x: 300
      y: 400
    data:
      label: Done
edges:
  - source: start_1
    target: loop_2
  - source: loop_2
    target: agent_3
    label: body
  - source: loop_2
    target: end_5
    label: exit
  - source: agent_3
    target: delay_4
  - source: delay_4
    target: loop_2
