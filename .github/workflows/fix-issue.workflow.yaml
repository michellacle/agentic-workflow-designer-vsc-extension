name: fix-issue
nodes:
  - id: start
    type: start
    position:
      x: 300
      'y': 0
    data:
      label: Start
  - id: analyze_issue
    type: agent
    position:
      x: 300
      'y': 140
    data:
      agent: reviewer
      prompt: 'Analyze the reported issue. Determine whether it is: (1) a defect in existing functionality, (2) a regression caused by a recent change, or (3) a feature that was built but does not work well after testing. Return a JSON object with: issue_type (one of "defect", "regression", "feature_problem"), summary (string - concise description of the issue), root_cause (string - what is causing the issue), and recommended_action (one of "fix", "revert").'
      model: qwen3.6-27b
      timeout: 120
      retries: 0
      stateWrites:
        - source: issue_type
          target: state.issue_type
        - source: summary
          target: state.issue_summary
        - source: root_cause
          target: state.root_cause
        - source: recommended_action
          target: state.recommended_action
  - id: check_action
    type: condition
    position:
      x: 300
      'y': 300
    data:
      expression: state.recommended_action === "revert"
      description: Revert the feature or apply a targeted fix?
  - id: implement_fix
    type: agent
    position:
      x: 120
      'y': 460
    data:
      agent: implementer
      prompt: 'Implement a targeted fix for the issue. Use the analysis from state.issue_summary and state.root_cause to guide your implementation. Make minimal, focused changes to resolve the defect or regression. Do not introduce unrelated changes.'
      model: qwen3.6-27b
      timeout: 300
      retries: 0
  - id: revert_feature
    type: agent
    position:
      x: 480
      'y': 460
    data:
      agent: implementer
      prompt: 'Revert the problematic feature. Identify the changes introduced by the feature and carefully remove or roll them back. Ensure the revert does not break other functionality. Preserve any data or state that should not be lost.'
      model: qwen3.6-27b
      timeout: 300
      retries: 0
  - id: run_tests
    type: agent
    position:
      x: 300
      'y': 620
    data:
      agent: tester
      prompt: 'Run the full test suite to verify the fix or revert does not introduce regressions. Additionally, create or update tests that specifically cover the issue scenario to prevent recurrence. Report test results and any failures.'
      model: qwen3.6-27b
      timeout: 180
      retries: 0
  - id: review_changes
    type: agent
    position:
      x: 300
      'y': 760
    data:
      agent: reviewer
      prompt: 'Review all changes made to fix or revert the issue. Verify the changes are correct, minimal, and well-tested. Return a JSON object with: passed (boolean), reason (string - detailed feedback).'
      model: qwen3.6-27b
      timeout: 120
      retries: 0
      stateWrites:
        - source: passed
          target: state.review_passed
  - id: check_review
    type: condition
    position:
      x: 300
      'y': 900
    data:
      expression: state.review_passed === true
      description: Review passed?
  - id: update_requirements
    type: agent
    position:
      x: 300
      'y': 1060
    data:
      agent: implementer
      prompt: 'Update the product requirements and context documentation to stay consistent with the implemented fix or revert. Edit product_requirements.md to reflect the corrected behavior, removed feature, or changed specification. Update CONTEXT.md to document what was changed and why. Ensure requirements accurately match the current state of the codebase.'
      model: qwen3.6-27b
      timeout: 120
      retries: 0
  - id: commit_push
    type: agent
    position:
      x: 300
      'y': 1200
    data:
      agent: builder
      prompt: 'Stage all changes, commit with a descriptive message referencing the issue type and summary, and push to remote. Use conventional commit format (fix:, revert:, or chore:) and include the issue summary in the commit body.'
      model: qwen3.6-27b
      timeout: 60
      retries: 1
  - id: end
    type: end
    position:
      x: 300
      'y': 1340
    data:
      label: Issue Resolved
      summary: true
  - id: note_issue_types
    type: note
    position:
      x: 540
      'y': 140
    data:
      text: |
        Issue Types:
        • Defect — bug in existing functionality
        • Regression — breakage from a recent change
        • Feature Problem — built feature fails testing
      description: Issue classification
  - id: note_requirements
    type: note
    position:
      x: 540
      'y': 1060
    data:
      text: |
        Requirements Sync:
        • Update product_requirements.md
        • Update CONTEXT.md
        • Ensure docs match implementation
      description: Keep requirements in sync
edges:
  - source: start
    target: analyze_issue
  - source: analyze_issue
    target: check_action
  - source: check_action
    target: implement_fix
    label: Fix
  - source: check_action
    target: revert_feature
    label: Revert
  - source: implement_fix
    target: run_tests
  - source: revert_feature
    target: run_tests
  - source: run_tests
    target: review_changes
  - source: review_changes
    target: check_review
  - source: check_review
    target: update_requirements
    label: Pass
  - source: check_review
    target: implement_fix
    label: Rework
  - source: update_requirements
    target: commit_push
  - source: commit_push
    target: end
description: Diagnose an issue (defect, regression, or failing feature), fix or revert it, validate with tests and review, then update product requirements to stay in sync with implementation
