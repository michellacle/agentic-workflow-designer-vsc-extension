name: PR Skill Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  pr-skill-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run PR skill reviewer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RESULT_PATH: /tmp/pr-skill-review-result.json
          SKILL_PATH: .github/skills/pr-review/SKILL.md
        run: node scripts/pr-skill-review.js

      - name: Publish review comment
        if: always()
        uses: actions/github-script@v7
        env:
          RESULT_PATH: /tmp/pr-skill-review-result.json
        with:
          script: |
            const fs = require('node:fs');
            const resultPath = process.env.RESULT_PATH;
            const result = JSON.parse(fs.readFileSync(resultPath, 'utf8'));
            const marker = result.marker || '<!-- pr-skill-review -->';
            const body = `${marker}\n${result.summary}`;

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100
            });

            const existing = comments.find(
              (comment) => comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body
              });
            }

      - name: Fail on blocking findings
        run: |
          node -e "const fs=require('node:fs');const r=JSON.parse(fs.readFileSync('/tmp/pr-skill-review-result.json','utf8'));if(!r.passed){console.error('Blocking PR skill findings detected.');process.exit(1)}"
